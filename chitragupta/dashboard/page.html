<script>
// Theme before first paint: ?theme= (not stored) > saved choice > the OS preference.
(function () {
  var t = null;
  try { var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; } catch (e) {}
  if (!t) { try { t = localStorage.getItem('cg-theme'); } catch (e) {} }
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {

    --bg: #111316; --surface: #181b1f; --surface-2: #22262c; --ink: #ede7d8; --ink-2: #c9c1ad; --ink-3: #a59d89;
    --line: #30353c; --line-strong: #4a515a; --accent: #f2955f; --accent-2: #3a2a20; --on-accent: #1a120c;
    --ok: #86d18a; --warn: #e8bd5c; --bad: #ff8f80; --ok-bg: #1c2b1e; --warn-bg: #2e2716; --bad-bg: #331d1b;
    --code-bg: #1e2226; --bar: #d9824f; color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #181b1f; --surface-2: #22262c; --ink: #ede7d8; --ink-2: #c9c1ad; --ink-3: #a59d89;
  --line: #30353c; --line-strong: #4a515a; --accent: #f2955f; --accent-2: #3a2a20; --on-accent: #1a120c;
  --ok: #86d18a; --warn: #e8bd5c; --bad: #ff8f80; --ok-bg: #1c2b1e; --warn-bg: #2e2716; --bad-bg: #331d1b;

* { box-sizing: border-box; }

.skip:focus { top: var(--s2); }

.small { font-size: 13px; }
.mono, code, pre, kbd { font-family: var(--font-mono); font-size: 13px; }

section.block, details.block { background: var(--surface); border: 1px solid var(--line); margin: 0 0 var(--s4); }

details.block > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform 160ms; align-self: center; margin-right: 2px; }

.body { padding: var(--s4); }
.body.flush { padding: 0; }

td.num, th.num { text-align: right; white-space: nowrap; }

.meter > span { display: block; height: 100%; background: var(--bar); }
.chip { display: inline-block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; border-radius: var(--radius); }

input[type="search"]:focus-visible { border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); margin-bottom: var(--s4); }

ul.plain > li:last-child { border-bottom: 0; }
.finding .t { font-weight: 600; }
.finding .d { color: var(--ink-2); margin-top: 2px; }
.finding .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.step-head { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap; margin-bottom: var(--s2); }
.method { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); }
.url { font-family: var(--font-mono); font-size: 13px; word-break: break-all; color: var(--ink-2); }
.copyrow { display: flex; gap: var(--s2); align-items: center; }

.md { max-width: 100%; }
.md table { margin: var(--s2) 0 var(--s4); font-size: 13px; }

.md h3:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.md ul, .md ol { padding-left: var(--s5); margin: 0 0 var(--s3); }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(function () {
  'use strict';
  var root = document.getElementById('main');
  var S = { cursor: null, copySeq: 0, mmdCache: new Map(), lastRoute: null, tickets: null };

  // ------------------------------------------------------------------ helpers
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtMin(m) {
    m = Math.round(m || 0);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60), r = m % 60;
    return h + 'h ' + (r < 10 ? '0' : '') + r + 'm';
  }
  function fmtHours(m) { return m ? (m / 60).toFixed(1) : ''; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function parseTs(s) { if (!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
  function fmtTs(s) {
    var d = parseTs(s); if (!d) return s ? esc(s) : '—';
    var now = new Date();
    var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return t;
    return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + t;
  }
  function fmtDay(s) {
    if (!s) return '—';
    var p = String(s).split('-'); if (p.length !== 3) return esc(s);
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
  }
  function ago(min) {
    if (min == null) return 'never';
    if (min < 1) return 'just now';
    if (min < 60) return min + ' min ago';
    if (min < 48 * 60) return Math.round(min / 60) + ' h ago';
    return Math.round(min / 1440) + ' days ago';
  }
  function state(cls, word) { return '<span class="state ' + cls + '">' + esc(word) + '</span>'; }
  function copyBtn(text, label, what) {
    return '<button type="button" class="copy" data-copy="' + esc(text) + '" aria-label="' + esc((label || 'Copy') + (what ? ' ' + what : '')) + '">' + esc(label || 'Copy') + '</button>';
  }
  function tlink(key) { return '<a href="#/tickets/' + encodeURIComponent(key) + '">' + esc(key) + '</a>'; }
  function block(key, title, count, inner, open) {
    return '<details class="block" data-key="' + esc(key) + '"' + (open === false ? '' : ' open') + '><summary><h2>' + esc(title) + '</h2>' +
      (count != null ? '<span class="count">' + esc(count) + '</span>' : '') + '</summary>' + inner + '</details>';
  }
  function section(title, extra, inner) {
    return '<section class="block"><div class="head"><h2>' + esc(title) + '</h2>' + (extra || '') + '</div>' + inner + '</section>';
  }
  function api(path) {
    return fetch(path, { headers: { 'Accept': 'application/json' }, cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  // ------------------------------------------------------------------ theme
  var themeBtn = document.getElementById('theme');
  function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'auto'; }
  function effectiveDark() {
    var t = currentTheme();
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function showTheme() { themeBtn.textContent = 'Theme: ' + currentTheme(); }
  themeBtn.addEventListener('click', function () {
    var next = { auto: 'light', light: 'dark', dark: 'auto' }[currentTheme()];
    if (next === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', next);
    try { if (next === 'auto') localStorage.removeItem('cg-theme'); else localStorage.setItem('cg-theme', next); } catch (e) {}
    showTheme();
    S.mmdCache.clear();
    renderMermaid();
  });
  showTheme();

  // ------------------------------------------------------------------ router
  function parseRoute() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var qi = raw.indexOf('?');
    var path = qi >= 0 ? raw.slice(0, qi) : raw, qs = qi >= 0 ? raw.slice(qi + 1) : '';
    var parts = path.split('/').filter(Boolean).map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    var params = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return; var i = kv.indexOf('=');
      try { params[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = decodeURIComponent(i < 0 ? '' : kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {}
    });
    var name = parts[0] || 'today';
    if (name === 'ticket') name = 'tickets';  // short deep link #/ticket/ABC-1
    if (['today', 'tickets', 'timesheet', 'health'].indexOf(name) < 0) name = 'today';
    return { name: name, arg: parts[1] ? parts[1].toUpperCase() : '', params: params };
  }
  function routeKey(r) { return r.name + '/' + r.arg; }
  function setNav(r) {
    document.querySelectorAll('nav.main a').forEach(function (a) {
      if (a.getAttribute('data-nav') === r.name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var t = { today: 'Today', tickets: r.arg || 'Tickets', timesheet: 'Timesheet', health: 'Health' }[r.name];
    document.title = t + ' · Chitragupta';
  }

  // ------------------------------------------------------------------ keep the reader's place on redraws
  function captureUi() {
    var ui = { y: window.scrollY, open: {}, focus: null, sel: null };
    root.querySelectorAll('details[data-key]').forEach(function (d) { ui.open[d.getAttribute('data-key')] = d.open; });
    var a = document.activeElement;
    if (a && root.contains(a)) {
      ui.focus = a.getAttribute('data-key') || a.id || null;
      if (a.tagName === 'INPUT') ui.sel = [a.selectionStart, a.selectionEnd];
    }
    return ui;
  }
  function restoreUi(ui) {
    if (!ui) return;
    root.querySelectorAll('details[data-key]').forEach(function (d) {
      var k = d.getAttribute('data-key');
      if (Object.prototype.hasOwnProperty.call(ui.open, k)) d.open = ui.open[k];
    });
    if (ui.focus) {
      var el = root.querySelector('[data-key="' + CSS.escape(ui.focus) + '"]') || document.getElementById(ui.focus);
      if (el) {
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
        if (ui.sel && el.setSelectionRange) { try { el.setSelectionRange(ui.sel[0], ui.sel[1]); } catch (e) {} }
      }
    }
    window.scrollTo(0, ui.y);
  }

  var renderSeq = 0;
  function render(navigation) {
    var r = parseRoute();
    var seq = ++renderSeq;
    var ui = navigation ? null : captureUi();
    setNav(r);
    var view = { today: viewToday, tickets: r.arg ? viewTicket : viewTickets, timesheet: viewTimesheet, health: viewHealth }[r.name];
    return view(r).then(function (html) { return html; }, function (e) {
      return '<h1>Something went wrong</h1><div class="error" role="alert">' + esc(e.message || e) + '</div>';
    }).then(function (html) {
      if (seq !== renderSeq) return;  // a newer render started
      root.innerHTML = html;
      afterRender(r);
      if (navigation) {
        window.scrollTo(0, 0);
        if (S.lastRoute !== null) { try { root.focus({ preventScroll: true }); } catch (e) {} }
      } else {
        restoreUi(ui);

  // ------------------------------------------------------------------ mini markdown (db-flow.md, README parts)
  function inline(s) {
    var codes = [];
    s = String(s).replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) { return '<span class="ref" title="' + u + '">' + t + '</span>'; });
    s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
  }
  function splitRow(line) {
    var t = line.trim();
    if (t[0] === '|') t = t.slice(1);
    if (t[t.length - 1] === '|' && t[t.length - 2] !== '\\') t = t.slice(0, -1);
    var cells = [], cur = '';
    for (var i = 0; i < t.length; i++) {
      if (t[i] === '\\' && t[i + 1] === '|') { cur += '|'; i++; continue; }
      if (t[i] === '|') { cells.push(cur.trim()); cur = ''; continue; }
      cur += t[i];
    }
    cells.push(cur.trim());
    return cells;
  }
  function md(text) {
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], para = [], i = 0, inComment = false;
    function flush() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    while (i < lines.length) {
      var ln = lines[i];
      if (inComment) { if (ln.indexOf('-->') >= 0) inComment = false; i++; continue; }
      if (/^\s*<!--/.test(ln)) { flush(); if (ln.indexOf('-->') < 0) inComment = true; i++; continue; }
      var f = /^\s*(```|~~~)\s*([\w-]*)/.exec(ln);
      if (f) {
        flush();
        var fence = f[1], lang = f[2], buf = [];
        i++;
        while (i < lines.length && lines[i].trim().indexOf(fence) !== 0) { buf.push(lines[i]); i++; }
        i++;
        var code = buf.join('\n');
        if (lang === 'mermaid') out.push('<div class="diagram" data-mmd><pre class="mmd-src">' + esc(code) + '</pre></div>');
        else out.push('<div class="copyrow" style="justify-content:flex-end;margin-bottom:4px">' + copyBtn(code, 'Copy', 'code') + '</div><pre><code>' + esc(code) + '</code></pre>');
        continue;
      }
      var hm = /^(#{1,6})\s+(.*)$/.exec(ln);
      if (hm) {
        flush();
        var lvl = Math.min(6, hm[1].length + 1);
        if (hm[1].length === 1) { i++; continue; }  // the file's own title: the page already has one
        out.push('<h' + lvl + '>' + inline(hm[2]) + '</h' + lvl + '>');
        i++; continue;
      }
      if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
        flush();
        var head = splitRow(ln), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        out.push('<div class="scroll"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>');
        continue;
      }
      var li = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(ln);
      if (li) {
        flush();
        var ordered = /\d/.test(li[1]), items = [];
        while (i < lines.length) {
          var m2 = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
          if (!m2) break;
          items.push(m2[2].replace(/^\[( |x)\]\s*/i, function (_, x) { return x.trim() ? '[x] ' : '[ ] '; }));
          i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (/^\s*(---|\*\*\*)\s*$/.test(ln)) { flush(); i++; continue; }
      if (!ln.trim()) { flush(); i++; continue; }
      para.push(ln.trim());
      i++;
    }
    flush();
    return out.join('\n');
  }

        s.src = '/vendor/mermaid.min.js';
        s.onload = function () { window.mermaid ? res(window.mermaid) : rej(new Error('Mermaid did not load')); };
        s.onerror = function () { mmdLoad = null; rej(new Error('Mermaid is not available')); };

  }
  var mmdTheme = null;
  function renderMermaid() {
    var nodes = Array.prototype.slice.call(root.querySelectorAll('[data-mmd]'));

    return loadMermaid().then(function (mermaid) {
      var theme = dark ? 'dark' : 'neutral';
      if (mmdTheme !== theme) {
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: theme, fontFamily: 'inherit', flowchart: { htmlLabels: false } });
        mmdTheme = theme;

      var chain = Promise.resolve();
      nodes.forEach(function (n) {
        var srcEl = n.querySelector('.mmd-src');
        var code = srcEl ? srcEl.textContent : n.getAttribute('data-code') || '';
        if (srcEl) n.setAttribute('data-code', code);

        chain = chain.then(function () {

          return mermaid.render('mmd' + (++mmdSeq), code).then(function (r) {

            document.querySelectorAll('body > [id^="dmmd"], body > svg[id^="mmd"]').forEach(function (x) { x.remove(); });
          });

      }).join('') + '</ul>' : '<div class="empty">No queries recorded.</div>', t.queries.length <= 6);
      // artifacts
      h += block('t:artifacts', 'Artifacts', t.artifacts.length, t.artifacts.length ? '<div class="scroll"><table><thead><tr><th>Date</th><th>Artifact</th><th class="hide-sm">Kind</th><th>Purpose</th><th class="num hide-sm">Versions</th></tr></thead><tbody>' +
        t.artifacts.map(function (a) {
          return '<tr><td class="nowrap">' + esc(a.last || a.date || '') + '</td><td>' + esc(a.name) + (a.path ? '<div>' + copyBtn(a.path, 'Copy path', a.name) + '</div>' : '') + '</td><td class="hide-sm">' + esc(a.kind || '') + '</td><td>' + esc(a.purpose || '') + '</td><td class="num hide-sm">' + esc(a.versions || 1) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">No artifacts filed.</div>');
      // timeline
      if (t.timeline.length) h += block('t:timeline', 'Timeline', t.timeline.length + ' days', '<div class="scroll"><table><thead><tr><th>Day</th><th class="num">Time</th><th>What</th></tr></thead><tbody>' +
        t.timeline.map(function (d) { return '<tr><td class="nowrap">' + esc(d.day) + '</td><td class="num">' + fmtMin(d.minutes) + '</td><td>' + esc(d.line) + '</td></tr>'; }).join('') + '</tbody></table></div>', false);
      var paths = Object.keys(t.paths || {});
      if (paths.length) h += block('t:paths', 'Files', paths.length, '<ul class="plain">' + paths.map(function (k) {
        return '<li class="copyrow"><span class="chip">' + esc(k) + '</span><span class="val mono small">' + esc(t.paths[k]) + '</span>' + copyBtn(t.paths[k], 'Copy path', k) + '</li>';
      }).join('') + '</ul>', false);
      return h;
    }, function (e) {
      if (e.status === 404) return '<div class="crumbs"><a href="#/tickets">Tickets</a> / ' + esc(key) + '</div><h1>' + esc(key) + '</h1><div class="empty">Nothing recorded for this ticket.</div>';
      throw e;
    });
  }

  // ------------------------------------------------------------------ Timesheet
  function viewTimesheet(r) {
    var period = r.params.period === 'month' ? 'month' : 'week';
    return api('/api/timesheet?period=' + period).then(function (d) {
      var h = '<h1>Timesheet</h1><div class="toolbar"><div class="seg" role="group" aria-label="Group by">' +
        '<button type="button" data-period="week" aria-pressed="' + (period === 'week') + '">ISO week</button>' +
        '<button type="button" data-period="month" aria-pressed="' + (period === 'month') + '">Month</button></div>' +
        '<a class="btn" href="/api/timesheet.csv?period=' + period + '" download>Download CSV</a>' +
        '<span class="muted small">Hours from recorded activity plus time logged by hand.</span></div>';
      if (!d.periods.length) return h + '<div class="empty">No days recorded yet.</div>';
      var ps = d.periods.slice().reverse();
      var grand = ps.reduce(function (a, p) { return a + (d.totals[p] || 0); }, 0);
      h += '<section class="block"><div class="scroll"><table><thead><tr><th>Ticket</th><th class="hide-sm">Title</th>' + ps.map(function (p) { return '<th class="num">' + esc(p) + '</th>'; }).join('') + '<th class="num">Total</th></tr></thead><tbody>' +
        d.rows.map(function (row) {
          return '<tr><td class="key">' + (row.ticket ? tlink(row.ticket) : '<span class="muted">—</span>') + '</td><td class="hide-sm">' + esc(row.title || '') + '</td>' +
            ps.map(function (p) { var m = row.minutes[p] || 0; return '<td class="num">' + (m ? fmtMin(m) : '<span class="muted">·</span>') + '</td>'; }).join('') +
            '<td class="num"><strong>' + fmtMin(row.total) + '</strong></td></tr>';
        }).join('') + '</tbody><tfoot><tr><td>Total</td><td class="hide-sm"></td>' + ps.map(function (p) { return '<td class="num">' + fmtMin(d.totals[p] || 0) + '</td>'; }).join('') + '<td class="num">' + fmtMin(grand) + '</td></tr></tfoot></table></div></section>';
      var KINDW = { leave: 'Leave', half_day: 'Half day', holiday: 'Holiday', workday: 'Extra workday' };
      h += section('Leave and holidays', '<span class="count">' + d.calendar.length + '</span>', d.calendar.length ? '<div class="scroll"><table><thead><tr><th>Date</th><th>Kind</th><th>Note</th></tr></thead><tbody>' +
        d.calendar.map(function (c) { return '<tr><td class="nowrap">' + esc(fmtDay(c.date)) + '</td><td>' + esc(KINDW[c.kind] || c.kind) + '</td><td>' + esc(c.name || '') + '</td></tr>'; }).join('') + '</tbody></table></div>'
        : '<div class="empty">None in this range. Tell Claude "I was on leave on …" or add a <code>leave:</code> line to inbox.md.</div>');
      if (d.manual.length) h += section('Time logged by hand', '<span class="count">' + d.manual.length + '</span>', '<div class="scroll"><table><thead><tr><th>Date</th><th>Ticket</th><th class="num">Time</th><th>Note</th></tr></thead><tbody>' +
        d.manual.map(function (m) { return '<tr><td class="nowrap">' + esc(m.date) + (m.start ? ' ' + esc(m.start) : '') + '</td><td class="key">' + (m.ticket ? tlink(m.ticket) : '') + '</td><td class="num">' + fmtMin(m.minutes) + '</td><td>' + esc(m.text || '') + '</td></tr>'; }).join('') + '</tbody></table></div>');
      return h;
    });
  }

  // ------------------------------------------------------------------ Health
  function card(title, st, big, lines) {
    return '<div class="card"><h2>' + esc(title) + ' ' + st + '</h2><div class="big">' + big + '</div>' + (lines || []).filter(Boolean).map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>';
  }
  function viewHealth() {
    return api('/api/status').then(function (s) {
      var h = '<h1>Health <span class="sub">' + esc(fmtDay(s.day)) + '</span></h1>';
      if (s.paused) h += '<div class="banner" role="status"><strong>Paused.</strong> Capture is paused; nothing new is recorded until you resume.</div>';
      var hk = s.hooks.minutes_ago;
      var g = '<div class="grid">';
      g += card('Hooks', hk == null ? state('bad', 'No events') : hk <= 24 * 60 ? state('ok', 'Firing') : state('warn', 'Quiet'),
        hk == null ? '—' : esc(ago(hk)), [s.hooks.last_event ? 'Last captured event ' + fmtTs(s.hooks.last_event) : 'No hook event captured yet']);
      var tk = s.tick.minutes_ago;
      g += card('Background tick', tk == null ? state('bad', 'Never ran') : tk <= 15 ? state('ok', 'Running') : tk <= 60 ? state('warn', 'Late') : state('bad', 'Stopped'),
        tk == null ? '—' : esc(ago(tk)), [s.tick.last_tick ? 'Last tick ' + fmtTs(s.tick.last_tick) : '', s.tick.last_tick_ok ? 'Last good tick ' + fmtTs(s.tick.last_tick_ok) : '']);
      var pu = s.push;
      g += card('Push', !pu.remote_set ? state('off', 'Off') : pu.error ? state('bad', 'Failing') : pu.minutes_ago == null ? state('warn', 'Not yet') : state('ok', 'OK'),
        pu.minutes_ago == null ? '—' : esc(ago(pu.minutes_ago)), [!pu.remote_set ? 'No remote configured; everything stays on this machine.' : '', pu.error ? esc(pu.error) : '', pu.last_commit ? 'Last commit ' + fmtTs(pu.last_commit) : '']);
      var sl = s.slack, last = (sl.recent || [])[0];
      var slState = sl.enabled === false ? state('off', 'Off') : sl.status === 'not_connected' || (!sl.configured && !last) ? state('off', 'Not connected')
        : sl.send_warning ? state('bad', 'Failing') : last && last.status === 'failed' ? state('warn', 'Retrying') : last && (last.status === 'sent' || last.status === 'nudged') ? state('ok', 'Sent') : state('off', 'Waiting');
      g += card('Slack worklog', slState, last ? esc(last.day) + ' · ' + esc(last.status || '—') : '—',
        [sl.send_at ? 'Sends at ' + esc(sl.send_at) : '', last && last.sent_at ? 'Sent ' + fmtTs(last.sent_at) : '', sl.send_warning ? esc(sl.send_warning) : '', last && last.last_error ? esc(last.last_error) : '',
          sl.status === 'not_connected' || (!sl.configured && !last) ? "Slack isn't connected; the worklog is still composed into the daily file." : '']);
      var mc = s.mcp;
      g += card('MCP today', state(mc.budget && mc.calls_today >= mc.budget ? 'warn' : 'ok', mc.calls_today + (mc.budget ? ' / ' + mc.budget : '') + ' jobs'),
        esc((mc.tokens_in_today || 0).toLocaleString()) + ' <span class="muted small">in</span> · ' + esc((mc.tokens_out_today || 0).toLocaleString()) + ' <span class="muted small">out</span>',
        ['Tokens today across MCP jobs and the Slack send', mc.cost_today ? 'Est. cost $' + esc(mc.cost_today) : '', mc.last_skip_reason ? 'Last skip: ' + esc(mc.last_skip_reason) : '']);
      var td = s.today || {};
      g += card('Recorder today', (td.errors || 0) ? state('warn', td.errors + ' errors') : state('ok', 'No errors'),
        esc(td.sessions != null ? td.sessions + ' sessions' : '—'), [td.extracted != null ? td.extracted + ' extracted' : '', td.cost_usd != null ? 'Est. usage $' + esc(td.cost_usd) : '', 'Errors all time: ' + esc(s.errors_total || 0)]);
      g += '</div>';
      h += g;
      var servers = mc.servers || [];
      var conf = (mc.configured || []).map(function (c) { return '<tr><td>' + esc(c.role === 'database' ? 'Database MCP' : 'Jira') + '</td><td class="mono">' + esc(c.server || '—') + '</td><td>' + (c.enabled ? state('ok', 'Enabled') : state('off', 'Off')) + '</td></tr>'; }).join('');
      h += section('MCP servers', '<span class="count">from the last background jobs</span>',
        (servers.length ? '<div class="scroll"><table><thead><tr><th>Server</th><th>Status</th><th>Last job</th><th>At</th></tr></thead><tbody>' + servers.map(function (x) {
          var ok = x.status === 'connected';
          return '<tr><td class="mono">' + esc(x.server) + '</td><td>' + (ok ? state('ok', 'Connected') : state('bad', x.status || 'unknown')) + '</td><td class="mono small">' + esc(x.job) + '</td><td class="nowrap">' + fmtTs(x.at) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">No MCP job has run yet.</div>') +
        (conf ? '<div class="body small muted" style="padding-bottom:0">Configured for background jobs</div><div class="scroll"><table><thead><tr><th>Role</th><th>Server</th><th>Jobs</th></tr></thead><tbody>' + conf + '</tbody></table></div>' : '') +
        (Object.keys(mc.offline || {}).length ? '<div class="body small">' + Object.keys(mc.offline).map(function (k) { return '<div><span class="chip">offline</span> ' + esc(k) + ': ' + esc(mc.offline[k]) + '</div>'; }).join('') + '</div>' : ''));
      if ((s.warnings || []).length) h += section('Warnings', '<span class="count">' + s.warnings.length + '</span>', '<ul class="plain">' + s.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>');
      h += section('Recent errors', '<span class="count">' + s.errors.length + '</span>', s.errors.length ? '<ul class="plain errlist">' + s.errors.slice().reverse().map(function (e) { return '<li><span class="chip">' + esc(e.source) + '</span> ' + esc(e.text) + '</li>'; }).join('') + '</ul>' : '<div class="empty">No recent errors.</div>');
      var ds = s.dashboard || {};
      h += '<p class="muted small">Dashboard ' + esc(ds.version || '') + ' · pid ' + esc(ds.pid || '') + ' · port ' + esc(ds.port || '') + ' · started ' + fmtTs(ds.started_at) + ' · data home <span class="mono">' + esc(s.home) + '</span></p>';
      return h;
    });
  }

  // ------------------------------------------------------------------ live updates: poll the change cursor
  function poll() {
    if (document.hidden) return;
    api('/api/changes').then(function (c) {
      var moved = S.cursor !== null && c.cursor !== S.cursor;
      S.cursor = c.cursor;
      if (moved) render(false).then(function () { updatedAt = new Date(); showUpdated(); });
    }, function () { live.textContent = 'Offline: the dashboard server is not answering'; });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  setInterval(poll, 10000);

  if (!location.hash) { try { history.replaceState(null, '', '#/today'); } catch (e) {} }
  render(true).then(function () { updatedAt = new Date(); showUpdated(); poll(); });
})();
</script>
</body>
</html>
